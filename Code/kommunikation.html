<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kommunikation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="resident-theme">
    <header class="topbar">
        <button class="icon-btn back-btn" aria-label="Zurück">&#8592;</button>
        <h1>KOMMUNIKATION</h1>
        <button class="icon-btn more-btn" aria-label="Optionen">&#8942;</button>
    </header>

    <section aria-label="Announcements Liste">
        <ul id="announcement-list">
          <!-- Beispiel-Item (nur Platzhalter) -->
          <li>
            <h2>Beispiel: Übergabe 14:00</h2>
            <p>Heute bitte pünktlich zur Übergabe im Aufenthaltsraum.</p>
            <small>von Admin • 07.01.2026</small>
          </li>
        </ul>
      </section>
  

    <!-- Eingabebereich fix oberhalb des Footers -->
    <section aria-label="Neues Announcement erstellen">
        <h2>Neues Announcement</h2>
  
        <form id="announcement-form">
          <label for="title">Titel</label>
          <input id="title" name="title" type="text" required maxlength="80" />
  
          <label for="message">Nachricht</label>
          <textarea id="message" name="message" rows="4" required maxlength="500"></textarea>
  
          <button type="submit">Posten</button>
        </form>
  
        <p id="form-msg" aria-live="polite"></p>
      </section>


    <footer>
        <a href="Events.html" class="footer-link footer-btn" aria-label="Veranstaltungen">
            <img src="icon/veranstaltung.png" alt="Veranstaltungen" class="footer-icon">
        </a>
        <a href="Bewohner.html" class="footer-link" aria-label="Bewohner">
            <img src="icon/patient.png" alt="Bewohner" class="footer-icon">
        </a>
        <a href="Kommunikation.html" class="footer-link" aria-label="Kommunikation">
            <img src="icon/plaudern.png" alt="Kommunikation" class="footer-icon">
        </a>
        <a href="Account.html" class="footer-link" aria-label="Account">
            <img src="icon/konto.png" alt="Account" class="footer-icon">
        </a>
    </footer>

    <script src="kommunikation.js"></script>
    
</body>
</html>
